name: Тесты и линтер

# Прогон на каждый push и pull request: тестов больше трёхсот, и запускались они
# до сих пор только руками — то есть ровно тогда, когда о них вспоминали (INFRA-3).
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    strategy:
      # Обе версии проверяются до конца: падение на одной не отменяет прогон на
      # другой, иначе расхождение между ними осталось бы наполовину невидимым.
      fail-fast: false
      matrix:
        # 3.12 — заявленный минимум, 3.14 — то, на чём идёт разработка. Прежде
        # проверялась только первая, то есть та, на которой код не запускают
        # каждый день (INFRA-11).
        python-version: ["3.12", "3.14"]

    name: Python ${{ matrix.python-version }}

    env:
      # Тесты слоя Qt идут без экрана; тот же режим, что и локально.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Колесо PyQt6 несёт с собой только сам Qt и ICU; GL, EGL, xkbcommon и шрифты
      # оно ждёт от системы, а в образе раннера их нет. Без них `import PyQt6.QtWidgets`
      # падает на этапе загрузчика — до того, как Qt вообще выберет offscreen.
      - name: Системные библиотеки Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libfreetype6 libdbus-1-3 libx11-6

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff coverage
          # PyQt6 на сборочной машине нужен целиком: без него проверки Qt-слоя
          # не упадут, а молча пропустятся — и CI будет зелёным, ничего не проверив.
          python -c "import PyQt6.QtWidgets"

      - name: Линтер
        run: ruff check .

      - name: Компиляция
        run: python -m compileall -q . -x '\.venv'

      - name: Тесты
        run: coverage run -m unittest discover -s tests -t . -v

      # Порога намеренно нет: сначала надо увидеть число, а потом решать, каким
      # ему быть. Порог, поставленный вслепую, обычно приводит к тестам ради
      # процента, а не ради проверки (INFRA-9).
      - name: Покрытие
        run: coverage report
