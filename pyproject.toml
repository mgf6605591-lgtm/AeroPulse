[project]
name = "aeropulse"
version = "0.1.0"
description = "Учёт статистической отчётности гражданской авиации: формы 12-ГА и 15-ГА"
requires-python = ">=3.12"

[tool.ruff]
# Тот же набор файлов, что и в прогоне тестов; .venv и сборочные каталоги — мимо.
extend-exclude = [".venv", "build", "dist"]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Взяты правила, находящие дефекты, а не оформление. Это тот класс, который в
# этом проекте уже выгребали руками: неиспользуемые импорты (DEAD-11), мёртвый
# код (DEAD-1…DEAD-12), подозрительные конструкции вроде приоритета операторов
# в подстановке кода показателя (BUG-1).
#
# Правила оформления (E, W, UP, C4) намеренно не включены: на текущем коде они
# дают около пятисот замечаний, почти все — механические (Optional → X | None и
# подобное). Это отдельная правка, которую стоит делать осознанно и одним
# коммитом, а не смешивать с заведением линтера: иначе полезные находки утонут.
select = [
    "F",    # pyflakes: неиспользуемое, необъявленное, недостижимое
    "B",    # flake8-bugbear: подозрительные конструкции
]

[tool.ruff.lint.per-file-ignores]
# Ревизии Alembic создаются шаблоном и содержат неиспользуемые заготовки.
"migrations/versions/*.py" = ["F401"]
# Сигнатуры моделей Qt задаёт сам Qt: `def rowCount(self, parent=QModelIndex())`
# — требуемая форма, а не недосмотр. Значение по умолчанию здесь не разделяется
# между вызовами так, чтобы это было опасно.
"db/models/*_model.py" = ["B008"]
