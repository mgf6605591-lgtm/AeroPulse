[project]
name = "aeropulse"
version = "1.0.0"
description = "Учёт статистической отчётности гражданской авиации: формы 12-ГА и 15-ГА"
requires-python = ">=3.12"

[tool.mypy]
# Проверяется то, что уже аннотировано, а не весь код разом: `--strict` на
# кодовой базе с частичной разметкой даёт тысячи замечаний о недостающих
# аннотациях и ни одного о настоящих расхождениях (INFRA-7).
#
# Стабов у PyQt6 и Alembic либо нет, либо они неполны; ignore_missing_imports
# отключает жалобы на сами импорты, оставляя проверку нашего кода.
python_version = "3.12"
ignore_missing_imports = true
files = ["controllers", "db", "forms", "importers", "parsers", "services", "utils", "main.py"]
# Ревизии Alembic создаются шаблоном: их разметку ведём не мы.
exclude = "^migrations/"

[tool.coverage.run]
# Считается код приложения: покрытие самих тестов ни о чём не говорит.
#
# `main.py` в списке не стоит намеренно. Путь к файлу, а не имя пакета, coverage
# пытается импортировать сам — и точка входа, поднимающая Qt, тянет за собой
# numpy второй раз в том же процессе. numpy этого не прощает («cannot load module
# more than once per process»), и падает не отчёт, а четырнадцать тестов подряд.
branch = true
source = ["controllers", "db", "forms", "importers", "parsers", "services", "utils"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
# Тот же набор файлов, что и в прогоне тестов; .venv и сборочные каталоги — мимо.
extend-exclude = [".venv", "build", "dist"]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Взяты правила, находящие дефекты, а не оформление. Это тот класс, который в
# этом проекте уже выгребали руками: неиспользуемые импорты (DEAD-11), мёртвый
# код (DEAD-1…DEAD-12), подозрительные конструкции вроде приоритета операторов
# в подстановке кода показателя (BUG-1).
#
# UP включён отдельным заходом, как и планировалось: правка механическая
# (Optional[X] → X | None, List → list), и смешивать её с содержательной было
# нельзя — полезные находки утонули бы в пятистах замечаниях (INFRA-8).
#
# E, W и C4 по-прежнему выключены. Это уже не «потом»: E и W — про оформление,
# которое здесь ведётся руками и осознанно (длинные строки таблиц раскладки,
# выравнивание словарей), а C4 переписывает выражения, а не устаревшие формы.
select = [
    "F",    # pyflakes: неиспользуемое, необъявленное, недостижимое
    "B",    # flake8-bugbear: подозрительные конструкции
    "UP",   # pyupgrade: конструкции, устаревшие для заявленного Python
]

[tool.ruff.lint.per-file-ignores]
# Ревизии Alembic создаются шаблоном и содержат неиспользуемые заготовки.
"migrations/versions/*.py" = ["F401"]
# Сигнатуры моделей Qt задаёт сам Qt: `def rowCount(self, parent=QModelIndex())`
# — требуемая форма, а не недосмотр. Значение по умолчанию здесь не разделяется
# между вызовами так, чтобы это было опасно.
"forms/models/*_model.py" = ["B008"]
